name: Mobile Appium Tests

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Appium Tests on Android Emulator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      APP_PATH: app/clock_7_4.apk
      APPIUM_NO_RESET: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ]; then
            ls -l /dev/kvm
          else
            echo "KVM not available on this runner; continuing with software acceleration."
          fi

      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-linux-hw-accel: auto
          disable-animations: true
          script: |
            echo "Waiting for system services to stabilize..."
            sleep 10

            adb shell input keyevent 82 || true
            adb install -r "$APP_PATH"
            adb shell pm grant com.google.android.deskclock android.permission.POST_NOTIFICATIONS
            adb shell am force-stop com.google.android.deskclock
            adb shell am start -W -n com.google.android.deskclock/com.android.deskclock.DeskClock

            echo "Waiting for the Clock app navigation tabs..."
            for attempt in $(seq 1 20); do
              adb shell uiautomator dump /sdcard/clock-window.xml > /dev/null 2>&1 || true
              if adb shell cat /sdcard/clock-window.xml | grep -q 'tab_menu_clock'; then
                break
              fi
              sleep 1
            done

            adb shell cat /sdcard/clock-window.xml | grep -q 'tab_menu_clock' || {
              echo "Clock app did not show its navigation tabs."
              adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
              adb shell cat /sdcard/clock-window.xml || true
              exit 1
            }

            set +e
            npm run test:local
            test_status=$?

            if [ "$test_status" -ne 0 ]; then
              mkdir -p ci-diagnostics
              adb shell dumpsys window > ci-diagnostics/window.txt 2>&1 || true
              adb shell dumpsys activity activities > ci-diagnostics/activities.txt 2>&1 || true
              adb shell pm path com.google.android.deskclock > ci-diagnostics/installed-app.txt 2>&1 || true
              adb exec-out screencap -p > ci-diagnostics/screen.png || true
              adb shell uiautomator dump /sdcard/window.xml > /dev/null 2>&1 || true
              adb pull /sdcard/window.xml ci-diagnostics/window.xml > /dev/null 2>&1 || true
              adb logcat -d -t 3000 > ci-diagnostics/logcat.txt 2>&1 || true
              echo "Foreground activity:"
              adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
              echo "Current UI hierarchy:"
              cat ci-diagnostics/window.xml || true
            fi

            exit "$test_status"

      - name: Upload emulator diagnostics
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: emulator-diagnostics
          path: ci-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 1

  publish-report:
    name: Generate and publish Allure report
    needs: test
    if: always()
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Download Allure results
        uses: actions/download-artifact@v5
        continue-on-error: true
        with:
          name: allure-results
          path: allure-results/

      - name: Keep Allure history
        uses: actions/checkout@v5
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-dir

      - name: Copy history
        if: always()
        run: |
          mkdir -p allure-results/history
          cp -R gh-pages-dir/history/* allure-results/history/ || true

      - name: Generate Allure report
        if: always()
        run: npm run report:generate

      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always() && github.event_name != 'pull_request'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          keep_files: false
      
      - name: Add Allure Report Link to Summary
        if: always() && github.event_name != 'pull_request'
        run: |
          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          
          echo "### 📊 Test Results & Reports" >> $GITHUB_STEP_SUMMARY
          echo "- [Open last Allure Report]($REPORT_URL)" >> $GITHUB_STEP_SUMMARY