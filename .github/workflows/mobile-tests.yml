name: Mobile Appium Tests

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Appium Tests on Android Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_PATH: app/clock_7_4.apk

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            echo "Waiting for system services to stabilize..."
            sleep 10
            
            adb shell input keyevent 82 || true

            npm run test:local

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          if-no-files-found: ignore
          retention-days: 1

  publish-report:
    name: Generate and publish Allure report
    needs: test
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Download Allure results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-results
          path: allure-results/

      - name: Keep Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages-dir

      - name: Copy history
        if: always()
        run: |
          mkdir -p allure-results/history
          cp -R gh-pages-dir/history/* allure-results/history/ || true

      - name: Generate Allure report
        if: always()
        run: npm run report:generate

      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always() && github.event_name != 'pull_request'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          keep_files: false
      
      - name: Add Allure Report Link to Summary
        if: always() && github.event_name != 'pull_request'
        run: |
          REPORT_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          
          echo "### 📊 Test Results & Reports" >> $GITHUB_STEP_SUMMARY
          echo "- [Открыть последний Allure Report]($REPORT_URL)" >> $GITHUB_STEP_SUMMARY